name: Bug Report
description: Report incorrect diagnostics, unexpected behavior, or failures.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with linux-perf-doctor.

        Before submitting, check the documentation and existing issues.

        **Security warning:** Remove passwords, API keys, tokens, private
        keys, private hostnames, IP addresses, and sensitive process data
        from all logs and diagnostic output. Never publish vulnerability
        details in a public issue.

  - type: input
    id: skill_version
    attributes:
      label: linux-perf-doctor version
      description: Which version are you using?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Linux distribution, kernel version, Python version, and relevant container information.
      placeholder: |
        Distribution:
        Kernel:
        Python:
        Container environment:
    validations:
      required: true

  - type: input
    id: agent_runtime
    attributes:
      label: Agent or runtime
      description: Which AI agent or execution environment are you using?
      placeholder: "Claude Code, OpenAI Codex, Gemini CLI, standalone CLI, etc."
    validations:
      required: false

  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: Provide the sanitized command or steps used to reproduce the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized output and logs
      description: Include relevant errors or diagnostic output after removing sensitive information.
    validations:
      required: false
