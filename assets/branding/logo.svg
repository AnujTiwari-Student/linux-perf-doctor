<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="linux-perf-doctor logo" xmlns:c2pa="http://c2pa.org/manifest">
  <title>linux-perf-doctor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#07101D"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19E3B1"/>
      <stop offset="0.6" stop-color="#3FA9FF"/>
      <stop offset="1" stop-color="#FF5C7A"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#19E3B1"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Container / cgroup hexagon -->
  <polygon points="256,36 446.5,146 446.5,366 256,476 65.5,366 65.5,146"
           fill="url(#bg)" stroke="#19E3B1" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="256,62 424,159 424,353 256,450 88,353 88,159"
           fill="none" stroke="#3FA9FF" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- PSI pressure gauge ring (gap = headroom) -->
  <circle cx="256" cy="236" r="120" fill="none" stroke="#1C2B42" stroke-width="16"/>
  <circle cx="256" cy="236" r="120" fill="none" stroke="url(#gauge)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="566 188" transform="rotate(135 256 236)"/>

  <!-- Heartbeat / syscall trace -->
  <path d="M 110 236 H 190 L 212 236 L 228 168 L 252 324 L 276 194 L 292 236 H 380"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="394" cy="236" r="9" fill="#FF5C7A"/>
  <circle cx="394" cy="236" r="16" fill="none" stroke="#FF5C7A" stroke-opacity="0.5" stroke-width="3"/>

  <!-- Flame-graph bars -->
  <g fill="url(#flame)">
    <rect x="196" y="412" width="12" height="20" rx="3"/>
    <rect x="214" y="398" width="12" height="34" rx="3"/>
    <rect x="232" y="382" width="12" height="50" rx="3"/>
    <rect x="250" y="404" width="12" height="28" rx="3"/>
    <rect x="268" y="390" width="12" height="42" rx="3"/>
    <rect x="286" y="408" width="12" height="24" rx="3"/>
    <rect x="304" y="416" width="12" height="16" rx="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
